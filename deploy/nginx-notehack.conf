# /etc/nginx/sites-available/notehack
# Replace certificates after certbot issuance if paths differ.

server {
    listen 80;
    listen [::]:80;
    server_name notehack.com www.notehack.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://notehack.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.notehack.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/notehack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notehack.com/privkey.pem;
    return 301 https://notehack.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notehack.com;

    ssl_certificate /etc/letsencrypt/live/notehack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notehack.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 600m;

    # Long-running streaming exports and imports.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 10s;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
        proxy_set_header Host $host;
    }
}
