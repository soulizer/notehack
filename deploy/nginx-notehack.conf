# /etc/nginx/sites-available/notehack
# Static app is served directly so a dead API never turns the whole site into a 502 page.

server {
    listen 80;
    listen [::]:80;
    server_name notehack.com www.notehack.com;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://notehack.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.notehack.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/notehack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notehack.com/privkey.pem;
    return 301 https://notehack.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notehack.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/notehack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notehack.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/notehack/apps/web/dist;
    index index.html;
    client_max_body_size 600m;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # API only. Static files stay available if the API is restarting.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        internal;
        root /var/www/notehack-errors;
    }
}
